server {
    listen 80;
    server_name api.localhost api-dev.localhost app.localhost app-dev.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.localhost;
    ssl_certificate /etc/nginx/certs/app.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/app.localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $backend http://api-prod:3000;
        proxy_pass $backend;
        include /etc/nginx/proxy_params;
    }
}

server {
    listen 443 ssl;
    server_name api-dev.localhost;
    ssl_certificate /etc/nginx/certs/app.localhost.pem;
